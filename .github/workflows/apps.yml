name: apps

# Standalone nsprog executables (no Python needed) for macOS, Windows and Linux.
# Every run uploads them as workflow artifacts; pushing a tag like v0.2.0 also
# attaches them to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./host pyinstaller
      - run: python host/packaging/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: nsprog-${{ runner.os }}
          path: host/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
