name: apps

# Standalone nsprog executables (no Python needed) for macOS, Windows and Linux.
# Every run uploads them as workflow artifacts; pushing a tag like v0.2.0 also
# attaches them to a GitHub release. A manual run with `release_tag` set builds
# `build_ref` (default: the run's commit), creates that tag and publishes the release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this tag and publish a release (e.g. v0.2.0); empty = artifacts only"
        required: false
        default: ""
      build_ref:
        description: "Commit / branch / tag to build (default: the run's commit)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./host pyinstaller
      - run: python host/packaging/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: nsprog-${{ runner.os }}
          path: host/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.sha }}
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ steps.rev.outputs.sha }}
          name: nsprog ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
