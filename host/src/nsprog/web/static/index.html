<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nsprog 编程器</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #677084; --line: #e2e5eb;
  --accent: #2563eb; --accent-2: #1e4fc2; --ok: #15803d; --bad: #c2410c; --warn: #b45309;
  --bar: #dbe4ff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11141a; --card: #1a1f28; --text: #e7eaf0; --muted: #98a1b3; --line: #2a313d;
          --accent: #5b8cff; --accent-2: #7aa2ff; --ok: #4ade80; --bad: #fb923c; --warn: #fbbf24;
          --bar: #26324d; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { padding: 18px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
header .status { margin-left: auto; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
.dot.on { background: var(--ok); }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px;
       grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.card h2 small { color: var(--muted); font-weight: 400; }
.wide { grid-column: 1 / -1; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
label { color: var(--muted); font-size: 13px; }
label.chk { color: var(--text); display: inline-flex; gap: 6px; align-items: center; }
select, input[type=number], input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line);
       border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 0; }
input[type=number] { width: 110px; }
button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
         padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-2); }
button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.chip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.chip.none { cursor: default; color: var(--muted); }
.chip b { display: block; margin-bottom: 2px; }
.chip .k { color: var(--muted); font-size: 12px; }
.warn { color: var(--warn); }
.ok { color: var(--ok); } .bad { color: var(--bad); }
.progress { height: 12px; border-radius: 6px; background: var(--bar); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; margin: 8px 0; flex-wrap: wrap; }
pre { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
      padding: 10px; max-height: 240px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
.msgs { font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; }
a.dl { font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>nsprog · NAND / SPI Flash 编程器</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">未连接</span></div>
</header>
<main>
  <section class="card">
    <h2>1 · 连接编程器</h2>
    <div class="row">
      <select id="port" style="flex:1"></select>
      <button onclick="loadPorts()">刷新</button>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="slowUart"> 串口保持 115200</label>
    </div>
    <div class="row">
      <button class="primary" id="btnConnect" onclick="doConnect()">连接</button>
      <button id="btnDisconnect" onclick="doDisconnect()">断开</button>
    </div>
    <div class="hint" id="linkInfo"></div>
  </section>

  <section class="card">
    <h2>2 · 识别芯片</h2>
    <div class="row">
      <label class="chk"><input type="checkbox" id="noRb"> 不使用 R/B#（轮询状态）</label>
      <label class="chk"><input type="checkbox" id="ecc"> SPI NAND 开片上 ECC</label>
    </div>
    <div class="row">
      <input type="text" id="forceChip" list="chipList" placeholder="手动指定型号（可选）" style="flex:1">
      <datalist id="chipList"></datalist>
      <select id="forceBus"><option value="nand">并口 NAND</option><option value="spi">SPI</option></select>
    </div>
    <div class="row"><button class="primary" id="btnDetect" onclick="doDetect()">检测</button></div>
    <div class="chips">
      <div class="chip none" id="tileNand" onclick="pick('nand')"><b>并口 NAND（TSOP48）</b><span class="k">未检测</span></div>
      <div class="chip none" id="tileSpi" onclick="pick('spi')"><b>SPI（SOP8 / WSON8 / SOIC16）</b><span class="k">未检测</span></div>
    </div>
    <div class="msgs" id="detMsgs"></div>
  </section>

  <section class="card wide">
    <h2>3 · 操作 <small id="targetName"></small></h2>
    <div class="row">
      <label>起始块</label><input type="number" id="start" value="0" min="0">
      <label>块数</label><input type="number" id="count" placeholder="全部" min="1">
      <span class="hint" id="geom"></span>
    </div>
    <div class="row">
      <label>坏块</label>
      <select id="bb">
        <option value="">默认（读：保持 / 写擦：跳过）</option>
        <option value="skip">跳过坏块</option>
        <option value="keep">保持物理地址</option>
        <option value="force">强制（会破坏坏块标记）</option>
      </select>
      <label>OOB</label>
      <select id="oob"><option value="auto">自动</option><option value="1">包含</option><option value="0">不包含</option></select>
      <label class="chk"><input type="checkbox" id="erase" checked> 写前擦除</label>
      <label class="chk"><input type="checkbox" id="verify" checked> 写后校验</label>
      <label>SPI MHz</label><input type="number" id="spiMhz" value="6.75" step="0.25" min="0.1" max="13.5">
      <label class="chk"><input type="checkbox" id="allow18"> 允许 1.8V 芯片</label>
    </div>
    <div class="row">
      <button class="primary" onclick="job('read')">读取</button>
      <button onclick="pickFile('write')">写入…</button>
      <button onclick="pickFile('verify')">校验…</button>
      <button class="danger" onclick="job('erase')">擦除</button>
      <button onclick="job('blank')">查空</button>
      <button onclick="job('badblocks')">坏块扫描</button>
      <input type="file" id="file" style="display:none">
    </div>
  </section>

  <section class="card wide">
    <h2>4 · 进度</h2>
    <div class="progress"><div id="bar"></div></div>
    <div class="stats"><span id="phase">空闲</span><span id="pct"></span><span id="speed"></span><span id="eta"></span>
      <button id="btnCancel" onclick="api('/api/job/cancel',{method:'POST'})" disabled>取消</button></div>
    <div id="result"></div>
    <pre id="log">就绪。</pre>
  </section>
</main>
<script>
let S = null, target = null, pendingOp = null, lastSpeed = {t: 0, d: 0, v: 0};
const $ = id => document.getElementById(id);

async function api(url, opt) {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { throw new Error(j.detail || r.statusText); }
  return j;
}
function note(t, cls) { const l = $('log'); l.textContent += '\n' + t; l.scrollTop = l.scrollHeight; }
function fmt(n) { if (n == null) return ''; const u = ['B','KiB','MiB','GiB']; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; }

async function loadPorts() {
  try {
    const j = await api('/api/ports');
    const sel = $('port'); sel.innerHTML = '<option value="">自动检测</option>';
    for (const p of j.ports) {
      const o = document.createElement('option'); o.value = p.device;
      o.textContent = p.device + (p.description ? ' — ' + p.description : '') + (p.likely ? ' ★' : '');
      sel.appendChild(o);
    }
    if (j.default) sel.value = j.default;
  } catch (e) { note('端口列表失败: ' + e.message); }
}
async function loadChips() {
  const j = await api('/api/chips');
  $('chipList').innerHTML = j.chips.map(c => `<option value="${c.name}">${c.type} ${c.detail}</option>`).join('');
}
async function doConnect() {
  $('btnConnect').disabled = true; note('连接中…');
  try { render(await api('/api/connect', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({port: $('port').value, slow_uart: $('slowUart').checked})}));
        note('已连接。'); await doDetect(); }
  catch (e) { note('连接失败: ' + e.message); }
  finally { $('btnConnect').disabled = false; }
}
async function doDisconnect() { try { render(await api('/api/disconnect', {method: 'POST'})); note('已断开。'); } catch (e) { note(e.message); } }
async function doDetect() {
  const chip = $('forceChip').value.trim(), bus = $('forceBus').value;
  try {
    render(await api('/api/detect', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({no_rb: $('noRb').checked, ecc: $('ecc').checked,
        nand_chip: bus === 'nand' ? chip : '', spi_chip: bus === 'spi' ? chip : ''})}));
  } catch (e) { note('检测失败: ' + e.message); }
}
function pick(t) { if (S && S[t]) { target = t; render(S); } }

function tile(el, d, title) {
  el.classList.toggle('none', !d); el.classList.toggle('sel', !!d && target === (el.id === 'tileNand' ? 'nand' : 'spi'));
  if (!d) { el.innerHTML = `<b>${title}</b><span class="k">未发现芯片</span>`; return; }
  const v = d.voltage ? d.voltage.toFixed(1) + 'V' : '电压未知';
  el.innerHTML = `<b>${d.name}</b><span class="k">${fmt(d.size)} · 页 ${d.page_size}${d.spare_size ? '+' + d.spare_size : ''} · ${d.blocks} 块 · ${v}</span>` +
    (d.voltage && d.voltage < 2.5 ? '<div class="warn">1.8V 芯片：需要电平转换转接板</div>' : '');
}
function render(s) {
  S = s;
  $('dot').classList.toggle('on', s.connected);
  $('status').textContent = s.connected ? `已连接 ${s.port || ''}` : '未连接';
  if (s.info) $('linkInfo').textContent = `固件 ${s.info.gw_version} · ${s.info.port ? 'FT232H 高速通道' : 'UART' + (s.baud ? ' ' + s.baud + ' baud' : '')} · 上位机 ${s.version}`;
  if (!s[target]) target = s.nand ? 'nand' : (s.spi ? 'spi' : null);
  tile($('tileNand'), s.nand, '并口 NAND（TSOP48）');
  tile($('tileSpi'), s.spi, 'SPI（SOP8 / WSON8 / SOIC16）');
  $('detMsgs').innerHTML = (s.messages || []).map(m => `<div class="hint">${m}</div>`).join('');
  const d = target ? s[target] : null;
  $('targetName').textContent = d ? '→ ' + d.name : '（先检测芯片）';
  $('geom').textContent = d ? `每块 ${fmt(d.block_size)}，共 ${d.blocks} 块` : '';
  renderJob(s.job);
}
function renderJob(j) {
  const running = j && j.state === 'running';
  $('btnCancel').disabled = !running;
  if (!j) return;
  const pct = j.total ? Math.min(100, 100 * j.done / j.total) : (j.state === 'running' ? 0 : 100);
  $('bar').style.width = pct.toFixed(1) + '%';
  $('phase').textContent = ({running: '进行中', done: '完成', failed: '失败', cancelled: '已取消'}[j.state] || j.state) + ' · ' + j.op + (j.phase ? ' / ' + j.phase : '');
  $('pct').textContent = pct.toFixed(1) + '%';
  const now = Date.now() / 1000;
  if (running && j.done > lastSpeed.d && now - lastSpeed.t > 0.5) {
    if (lastSpeed.t) lastSpeed.v = (j.done - lastSpeed.d) / (now - lastSpeed.t);
    lastSpeed = {t: now, d: j.done, v: lastSpeed.v};
  }
  $('speed').textContent = running && lastSpeed.v ? fmt(lastSpeed.v) + '/s' : '';
  $('eta').textContent = running && lastSpeed.v && j.total ? '剩余约 ' + Math.ceil((j.total - j.done) / lastSpeed.v) + ' 秒' : '';
  const lines = (j.messages || []).join('\n');
  let html = '';
  if (j.report) html += `<div class="${j.report.ok ? 'ok' : 'bad'}"><pre>${j.report.summary}</pre></div>`;
  if (j.download && j.state === 'done') html += `<p><a class="dl" href="${j.download}">下载读取结果</a></p>`;
  $('result').innerHTML = html;
  if (lines) $('log').textContent = lines;
}
function params(extra) {
  const p = new URLSearchParams({target, start: $('start').value || 0, spi_mhz: $('spiMhz').value,
    allow_1v8: $('allow18').checked ? 1 : 0});
  if ($('count').value) p.set('count', $('count').value);
  if ($('bb').value) p.set('bb', $('bb').value);
  for (const [k, v] of Object.entries(extra || {})) p.set(k, v);
  return p;
}
function check() {
  if (!S || !S.connected) { alert('请先连接编程器'); return false; }
  if (!target) { alert('请先检测芯片'); return false; }
  if ($('bb').value === 'force' && !confirm('“强制”模式会擦写出厂坏块、破坏坏块标记，确定继续？')) return false;
  return true;
}
async function job(op) {
  if (!check()) return;
  if (op === 'erase' && !confirm(`确定擦除 ${S[target].name} 的所选范围？`)) return;
  const extra = {confirm: 1};
  if (op === 'read') extra.oob = $('oob').value === '0' ? 0 : 1;
  lastSpeed = {t: 0, d: 0, v: 0};
  $('log').textContent = '';
  try { render(await api(`/api/job/${op}?` + params(extra), {method: 'POST'})); }
  catch (e) { note('无法开始: ' + e.message); }
}
function pickFile(op) { if (!check()) return; pendingOp = op; $('file').value = ''; $('file').click(); }
$('file').addEventListener('change', async () => {
  const f = $('file').files[0]; if (!f) return;
  if (pendingOp === 'write' && !confirm(`将 ${f.name}（${fmt(f.size)}）写入 ${S[target].name}？`)) return;
  const extra = {oob: $('oob').value, erase: $('erase').checked ? 1 : 0, verify: $('verify').checked ? 1 : 0, confirm: 1};
  lastSpeed = {t: 0, d: 0, v: 0};
  $('log').textContent = '上传 ' + f.name + ' …';
  try { render(await api(`/api/job/${pendingOp}?` + params(extra), {method: 'POST', body: await f.arrayBuffer()})); }
  catch (e) { note('无法开始: ' + e.message); }
});

function live() {
  let ws;
  try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
  catch (e) { return poll(); }
  ws.onmessage = ev => render(JSON.parse(ev.data));
  ws.onclose = () => setTimeout(live, 1500);
  ws.onerror = () => { ws.close(); };
}
async function poll() { try { render(await api('/api/state')); } catch (e) {} setTimeout(poll, 600); }

loadPorts(); loadChips(); live();
</script>
</body>
</html>
